<!DOCTYPE html>
<html>
<head>
<title>AI Video Maker</title>

<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Arial;
}

button{
background:#0066ff;
color:white;
padding:15px;
border:none;
border-radius:10px;
font-size:18px;
margin:10px;
}

img,video{
width:280px;
margin-top:15px;
}
</style>

</head>

<body>

<h1>🎬 AI Video Maker</h1>

<p>Select Image</p>

<input type="file" accept="image/*" id="file" onchange="showImage(event)">

<br>

<img id="image">

<br><br>

<textarea id="prompt"
placeholder="Write cinematic video idea..."
style="width:300px;height:80px;"></textarea>

<br>

<button onclick="generateVideo()">
Generate Video
</button>

<h3 id="status"></h3>

<video id="video" controls style="display:none;"></video>


<script>

function showImage(event){

const img = document.getElementById("image");

img.src = URL.createObjectURL(event.target.files[0]);

}


async function generateVideo(){

document.getElementById("status").innerHTML =
"AI Creating Video...";


const prompt =
document.getElementById("prompt").value;


const file =
document.getElementById("file").files[0];


if(!file){

document.getElementById("status").innerHTML =
"Please select image";

return;

}


const formData = new FormData();

formData.append("image", file);

formData.append("prompt", prompt);



try{


const response = await fetch("/api/generate-video",{

method:"POST",

body:formData

});


const data = await response.json();


console.log(data);



if(data.taskId){

document.getElementById("status").innerHTML =
"Video generation started...";

}else{

document.getElementById("status").innerHTML =
"Video generation failed";

}


}

catch(error){

document.getElementById("status").innerHTML =
error.message;

}


}

</script>

</body>
</html>
